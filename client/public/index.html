<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tyler Nguyen — Web & Mobile Developer</title>
    <meta
      name="description"
      content="Tyler Nguyen is a Chicago-based web and mobile developer who builds full-stack apps with React and React Native."
    />
    <meta name="theme-color" content="#1d3557" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tyler Nguyen" />

    <!-- Link previews (iMessage, LinkedIn, Slack, X). Set SITE_URL at build
         time so the preview image and canonical URL are absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tyler Nguyen — Web & Mobile Developer" />
    <meta
      property="og:description"
      content="Chicago-based web and mobile developer building full-stack apps with React and React Native."
    />
    <meta property="og:image" content="<%= siteUrl %>/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tyler Nguyen, Web & Mobile Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <% if (siteUrl) { %>
    <meta property="og:url" content="<%= siteUrl %>/" />
    <link rel="canonical" href="<%= siteUrl %>/" />
    <% } %>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
